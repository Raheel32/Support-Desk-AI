services:
  - type: web
    name: support-desk-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BACKEND_API_KEY
        generateValue: true
      - key: AI_MODE
        value: rules
      - key: SEED_DEMO
        value: "true"
